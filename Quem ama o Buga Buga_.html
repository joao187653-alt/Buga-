<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quem ama o Buga Buga?</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#ff3d81;--bg2:#ff8a00;--bg3:#7c3aed;--card:rgba(255,255,255,.18);--text:#fff;--accent:#ffe14d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#c2185b;--bg2:#d46a00;--bg3:#4c1d95;--card:rgba(0,0,0,.28)}}
:root[data-theme="dark"]{--bg1:#c2185b;--bg2:#d46a00;--bg3:#4c1d95;--card:rgba(0,0,0,.28)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--text);text-align:center;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:300% 300%;animation:bg 14s ease infinite;overflow-x:hidden;min-height:100vh;min-height:100dvh}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
main{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,34px);padding:24px 16px}
.photo{width:clamp(150px,38vw,260px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 0 0 6px var(--accent),0 14px 40px rgba(0,0,0,.4);animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
h1{font-family:'Bangers',Impact,sans-serif;font-weight:400;letter-spacing:.04em;line-height:1;margin:0;font-size:clamp(2.6rem,10vw,6.5rem);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 40px rgba(255,255,255,.35);animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.03)}}
button{font-family:inherit;font-weight:900;cursor:pointer;border:0;color:#b0124f;background:#fff;border-radius:999px;font-size:clamp(1.1rem,4.4vw,1.9rem);padding:.9em 1.6em;max-width:100%;box-shadow:0 8px 0 #c9a100,0 14px 30px rgba(0,0,0,.3);background:linear-gradient(#fff6a8,var(--accent));transition:transform .12s,box-shadow .12s;animation:pulse 1.6s ease-in-out infinite}
button:hover{transform:translateY(-3px) scale(1.04)}
button:active{transform:translateY(6px);box-shadow:0 2px 0 #c9a100}
button:disabled{animation:none;cursor:default;opacity:.85;filter:saturate(.6);transform:none}
@keyframes pulse{50%{transform:scale(1.05)}}
.msg{min-height:1.6em;font-size:clamp(1.05rem,3.6vw,1.5rem);font-weight:900;background:var(--card);backdrop-filter:blur(6px);padding:.5em 1.1em;border-radius:18px}
.msg:empty{visibility:hidden}
.box{background:var(--card);backdrop-filter:blur(8px);border-radius:28px;padding:18px 28px 14px;border:2px solid rgba(255,255,255,.35)}
#count{font-family:'Bangers',Impact,sans-serif;font-size:clamp(4.5rem,22vw,12rem);line-height:1;color:var(--accent);text-shadow:0 5px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
#count.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25) rotate(-3deg)}}
.lbl{font-weight:900;font-size:clamp(.95rem,3.4vw,1.4rem);opacity:.95}
.heart{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:up linear forwards;opacity:.7}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.form{width:min(92vw,460px);background:var(--card);backdrop-filter:blur(8px);border-radius:22px;padding:14px 18px;text-align:left;display:flex;flex-direction:column;gap:10px;border:2px solid rgba(255,255,255,.3)}
.form[hidden],[hidden]{display:none!important}
.form label.chk{display:flex;gap:10px;align-items:center;font-weight:900;font-size:1rem;cursor:pointer}
.form input[type=checkbox]{width:22px;height:22px;accent-color:#ffe14d}
.fields{display:flex;flex-direction:column;gap:8px}
.fields input,.fields textarea{font:inherit;font-weight:700;width:100%;padding:.7em .9em;border-radius:14px;border:0;background:rgba(255,255,255,.92);color:#3a0a24;font-size:16px}
.fields textarea{resize:none;height:76px}
.tip{font-size:.88rem;font-weight:700;opacity:.95;margin:0}
.ghost{font-size:clamp(1rem,3.8vw,1.3rem);padding:.7em 1.4em;color:#fff;background:rgba(255,255,255,.2);box-shadow:0 5px 0 rgba(0,0,0,.25);animation:none;border:2px solid rgba(255,255,255,.6)}
.mural{width:min(92vw,560px);background:var(--card);backdrop-filter:blur(8px);border-radius:22px;padding:16px;border:2px solid rgba(255,255,255,.3);text-align:left}
.mural h2{font-family:'Bangers',Impact,sans-serif;font-weight:400;letter-spacing:.04em;font-size:1.9rem;margin:0 0 8px;text-align:center}
.mural ul{list-style:none;margin:0;padding:0;max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.mural li{background:rgba(255,255,255,.16);border-radius:14px;padding:.6em .9em;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.mural li span{font-weight:700;opacity:.95}
.mural p{margin:8px 0 0;text-align:center;font-weight:700;font-size:.9rem}
#rain{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

  <h1>QUEM AMA O BUGA BUGA?</h1>
  <div class="form" id="form">
    <label class="chk"><input type="checkbox" id="pub"> Quero aparecer na lista de quem ama (opcional)</label>
    <div class="fields" id="fields" hidden>
      <p class="tip">💡 Dica: se não quiser, não use seu nome real. Invente um apelido!</p>
      <input id="nm" type="text" maxlength="30" placeholder="Seu nome ou apelido" autocomplete="off">
      <textarea id="ms" maxlength="140" placeholder="Deixe uma mensagem de amor ao Buga Buga (opcional)"></textarea>
    </div>
  </div>
  <button id="btn" type="button" disabled>EU AMO O BUGA BUGA ❤️</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="box">
    <div id="count" aria-live="polite">0</div>
    <div class="lbl" id="lbl">pessoas amam o Buga Buga</div>
  </div>
  <button class="ghost" id="toggle" type="button">VER QUEM AMOU 👀</button>
  <section class="mural" id="mural" hidden>
    <h2>Mural do amor ao Buga Buga</h2>
    <ul id="list"></ul>
    <p id="empty">Ninguém apareceu no mural ainda. Seja o primeiro!</p>
    <p id="hid"></p>
  </section>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},btn=$('btn'),msg=$('msg'),cnt=$('count'),lbl=$('lbl');
  var shown=0,target=0,raf=null,myId=null,voted=false,col=null,loaded=false;

  function render(){cnt.textContent=Math.round(shown).toLocaleString('pt-BR');lbl.textContent=target===1?'pessoa ama o Buga Buga':'pessoas amam o Buga Buga'}
  function tween(){
    cancelAnimationFrame(raf);
    (function step(){
      var d=target-shown;
      if(Math.abs(d)<.5){shown=target;render();return}
      shown+=d*.12;render();raf=requestAnimationFrame(step);
    })();
  }
  function setCount(n){
    if(n===target&&loaded)return;
    var up=loaded&&n>target;target=n;loaded=true;tween();
    if(up){cnt.classList.remove('bump');void cnt.offsetWidth;cnt.classList.add('bump')}
  }
  function hearts(n){
    var e=['❤️','💖','💛','🧡','💜','💗'];
    for(var i=0;i<n;i++){
      var h=document.createElement('div');h.className='heart';
      h.textContent=e[i%e.length];
      h.style.left=Math.random()*100+'vw';
      h.style.fontSize=(16+Math.random()*34)+'px';
      h.style.animationDuration=(5+Math.random()*7)+'s';
      h.style.animationDelay=(Math.random()*(n>10?.6:6))+'s';
      document.body.appendChild(h);
      setTimeout(function(x){return function(){x.remove()}}(h),14000);
    }
  }
  function lock(){voted=true;btn.disabled=true;btn.textContent='VOCÊ JÁ AMA! ❤️';$('form').hidden=true}
  function renderMural(snap){
    var items=[];
    snap.docs.forEach(function(d){var v=d.data()||{};if(v.pub===true)items.push(v)});
    items.sort(function(a,b){return (b.at||0)-(a.at||0)});
    var list=$('list');list.textContent='';
    items.forEach(function(v){
      var li=document.createElement('li'),n=document.createElement('b');
      n.textContent='❤️ '+(String(v.name||'').trim().slice(0,30)||'Anônimo');
      li.appendChild(n);
      var t=String(v.msg||'').trim().slice(0,140);
      if(t){var m=document.createElement('span');m.textContent=t;li.appendChild(m)}
      list.appendChild(li);
    });
    var h=snap.size-items.length;
    $('hid').textContent=h>0?h+(h===1?' pessoa preferiu não aparecer.':' pessoas preferiram não aparecer.'):'';
    $('empty').hidden=items.length>0;
  }
  $('pub').addEventListener('change',function(){$('fields').hidden=!$('pub').checked});
  $('toggle').addEventListener('click',function(){
    var m=$('mural');m.hidden=!m.hidden;
    $('toggle').textContent=m.hidden?'VER QUEM AMOU 👀':'ESCONDER LISTA 🙈';
    if(!m.hidden)m.scrollIntoView({behavior:'smooth',block:'nearest'});
  });

  async function init(){
    hearts(14);setInterval(function(){hearts(2)},2500);
    var db=null,user=null;
    try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
    if(!db||!user){msg.textContent='Entre na sua conta do Claude para votar e ver o contador ao vivo.';return}
    try{myId=await user.id()}catch(e){}
    if(!myId){msg.textContent='Não consegui identificar você. Entre na sua conta e recarregue.';return}
    col=db.collection('votes');
    var t=setTimeout(function(){if(!loaded)msg.textContent='Conectando ao contador…'},10000);
    col.onSnapshot(function(snap){
      clearTimeout(t);
      setCount(snap.size);renderMural(snap);
      var mine=snap.docs.some(function(d){return d.id===myId});
      if(mine&&!voted){lock();if(!msg.textContent)msg.textContent='Seu amor pelo Buga Buga foi registrado! ❤️'}
      if(!mine&&!voted)btn.disabled=false;
    },function(){msg.textContent='Erro ao carregar o contador. Tente recarregar.'});

    btn.addEventListener('click',async function(){
      if(voted)return;
      btn.disabled=true;
      try{
        var ref=col.doc(myId),cur=await ref.get();
        if(!cur.exists){
          var data={at:Date.now()};
          if($('pub').checked){data.pub=true;data.name=$('nm').value.trim().slice(0,30);data.msg=$('ms').value.trim().slice(0,140)}
          await ref.set(data);
        }
        lock();
        msg.textContent='Seu amor pelo Buga Buga foi registrado! ❤️';
        hearts(40);
      }catch(e){
        btn.disabled=false;
        msg.textContent=(e&&e.code==='not_granted')?'Você não tem permissão para votar neste site.':'Ops, não deu certo. Tente de novo!';
      }
    });
  }
  render();init();
})();
</script>
<script>
(function(){
  var cv=document.getElementById('rain');
  if(!cv||!cv.getContext)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var ctx=cv.getContext('2d'),W=0,H=0,dpr=1,ps=[],sp=[],raf=0,last=0,tm=0;
  function sprite(color){
    var c=document.createElement('canvas');c.width=c.height=96;
    var x=c.getContext('2d');
    x.font='900 84px Nunito,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.fillStyle=color;x.fillText('4',48,52);return c;
  }
  function build(){sp=[sprite('#ffffff'),sprite('#ffe14d')]}
  function rnd(a,b){return a+Math.random()*(b-a)}
  function spawn(p,top){
    p.s=rnd(14,60);
    p.x=rnd(0,W);
    p.y=top?-p.s:rnd(-p.s,H);
    p.v=22+p.s*1.3+rnd(0,18);
    p.a=rnd(.08,.38);
    p.r=rnd(-.5,.5);
    p.rv=Math.random()<.45?rnd(-.5,.5):0;
    p.c=Math.random()<.25?1:0;
    return p;
  }
  function size(){
    var w=window.innerWidth,h=window.innerHeight;
    if(w===W&&Math.abs(h-H)<160&&cv.width)return;
    W=w;H=h;dpr=Math.min(window.devicePixelRatio||1,1.5);
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    var n=Math.round(Math.min(40,Math.max(16,W*H/18000)));
    while(ps.length<n)ps.push(spawn({},false));
    ps.length=n;
  }
  function frame(t){
    raf=requestAnimationFrame(frame);
    if(t-last<33)return;
    var dt=Math.min((t-last)/1000,.1);last=t;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      p.y+=p.v*dt;p.r+=p.rv*dt;
      if(p.y-p.s>H){spawn(p,true);}
      var cs=Math.cos(p.r)*dpr,sn=Math.sin(p.r)*dpr;
      ctx.globalAlpha=p.a;
      ctx.setTransform(cs,sn,-sn,cs,p.x*dpr,p.y*dpr);
      ctx.drawImage(sp[p.c],-p.s/2,-p.s/2,p.s,p.s);
    }
  }
  function start(){if(!raf){last=0;raf=requestAnimationFrame(frame)}}
  function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
  build();size();start();
  if(document.fonts&&document.fonts.load){document.fonts.load('900 84px Nunito').then(build,function(){})}
  window.addEventListener('resize',function(){clearTimeout(tm);tm=setTimeout(size,200)});
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
})();
</script>
</body>
